<head>
    <style>
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            padding: 50px 30px;
            text-align: center;
            max-width: 500px;
        }
        .icon {
            font-size: 100px;
            color: #ffc107;
        }
        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center">
    <div class="card animate__animated animate__fadeInDown">
        <div class="icon mb-4">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="mb-3">404 - Page Not Found</h1>
        <p>The page you are looking for doesn't exist or may have been moved.<br>
           Please check the URL and try again.</p>
        <a href="./" class="btn btn-warning btn-home animate__animated animate__pulse animate__infinite">
            Return to Homepage
        </a>
    </div>
</div>

</body>
